NFS_CORE_PARAM {
    Protocols = 3, 4;
    NFS_Port = 2049;
    # No lock manager or quota daemon: the tests do not need them.
    Enable_NLM = false;
    Enable_RQUOTA = false;
}

NFSV4 {
    # Keep the post-start grace period short so that NFSv4 writes are
    # accepted quickly; the default is 90 seconds.
    Grace_Period = 5;
    Lease_Lifetime = 10;
}

EXPORT {
    Export_Id = 1;
    Path = /export;
    Pseudo = /export;
    Access_Type = RW;
    Squash = No_Root_Squash;
    SecType = sys;
    Protocols = 3, 4;
    Transports = TCP;

    FSAL {
        Name = VFS;
    }
}
