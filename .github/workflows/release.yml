name: release

on:
  push:
    branches:
      - testpypi-release
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the sdist
        run: |
          python -m pip install build
          python -m build --sdist

      - name: Check the metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  wheels:
    name: Build wheels (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Build the wheels (Python 3.8 and later)
        uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*"

      # Current cibuildwheel releases cannot build for Python 3.6 and 3.7.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the wheels (Python 3.6 and 3.7)
        uses: pypa/cibuildwheel@v2.11.4
        with:
          output-dir: wheelhouse-old
        env:
          CIBW_BUILD: "cp36-* cp37-*"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.arch }}
          path: |
            wheelhouse/*.whl
            wheelhouse-old/*.whl

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, wheels]
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/libnfs
    permissions:
      id-token: write   # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{dist,wheels-*}'
          path: dist/
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
