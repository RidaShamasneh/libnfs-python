name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the sdist
        run: |
          python -m pip install build
          python -m build --sdist

      - name: Check the metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  wheels:
    name: Build wheels (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Build the wheels (Python 3.9 and later)
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
          # Build the 32-bit x86 wheels too (cibuildwheel 4 does not by default).
          CIBW_ARCHS_LINUX: "x86_64 i686"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # cibuildwheel 4 dropped Python 3.8; 3.2.1 still builds it, including i686.
      - name: Build the wheels (Python 3.8)
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_BUILD: "cp38-*"
          CIBW_ARCHS_LINUX: "x86_64 i686"

      # Current cibuildwheel releases cannot build for Python 3.6 and 3.7.
      - name: Build the wheels (Python 3.6 and 3.7)
        uses: pypa/cibuildwheel@v2.11.4
        with:
          output-dir: wheelhouse-old
        env:
          CIBW_BUILD: "cp36-* cp37-*"
          # Skip the 32-bit container: the pip CMake needs libatomic there.
          CIBW_ARCHS_LINUX: native

      - name: Collect the wheels
        run: mv wheelhouse-old/*.whl wheelhouse/

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.arch }}
          path: wheelhouse/*.whl

  publish-testpypi:
    name: Publish to TestPyPI
    # Manual runs go to TestPyPI; tags go to PyPI below.
    if: github.ref_type == 'branch'
    needs: [build, wheels]
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/libnfs
    permissions:
      id-token: write   # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{dist,wheels-*}'
          path: dist/
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [build, wheels]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/libnfs
    permissions:
      id-token: write   # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{dist,wheels-*}'
          path: dist/
          merge-multiple: true

      # The tag must name the version that was built, e.g. v8.0.0.post1.
      - name: Check the tag against the built version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ls dist/
          test -f "dist/libnfs-${TAG#v}.tar.gz"

      - uses: pypa/gh-action-pypi-publish@release/v1
